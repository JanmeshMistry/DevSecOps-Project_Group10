<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisFlow Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>AegisFlow E-Commerce</h1>
        <p>Secure DevSecOps Powered Store</p>
    </header>

    <div class="container">
        {% for product in products %}
        <div class="card">
            <h2>{{ product.name }}</h2>
            <p>{{ product.price }}</p>
            <button>Buy Now</button>
        </div>
        {% endfor %}
    </div>

</body>
</html>
